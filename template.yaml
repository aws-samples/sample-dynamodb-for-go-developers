AWSTemplateFormatVersion: "2010-09-09"
Description: DynamoDB single table for the DynamoDB for Go Developers workshop

Resources:
  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: simple-inventory
      BillingMode: PAY_PER_REQUEST
      # Encrypt at rest with the AWS-managed KMS key for DynamoDB (CKV_AWS_119).
      # Uses the alias/aws/dynamodb key: no extra key resource, no monthly cost,
      # clean stack teardown, and no additional KMS IAM permissions needed.
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: alias/aws/dynamodb
      # Enable point-in-time recovery / continuous backups (CKV_AWS_28).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: placed_id
          AttributeType: S
        - AttributeName: status_date
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: inverted-index
          KeySchema:
            - AttributeName: sk
              KeyType: HASH
            - AttributeName: pk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: placed-index
          KeySchema:
            - AttributeName: placed_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: status-date-gsi
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      LocalSecondaryIndexes:
        - IndexName: status-date-index
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: status_date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

Outputs:
  TableName:
    Description: Name of the DynamoDB table
    Value: !Ref InventoryTable
  TableArn:
    Description: ARN of the DynamoDB table
    Value: !GetAtt InventoryTable.Arn
